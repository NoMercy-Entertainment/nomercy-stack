# Per-IP request limit for the website + API (nomercy.tv, api, cdn); used by
# website.conf. Lives here, not in nginx.conf: nginx.conf is a single-file
# bind mount, so a `git pull` only reaches the container after it is
# recreated, while this folder is a directory mount that `nginx -s reload`
# picks up.
#
# Sized from the real logs (2026-09-25): browsers and media servers stay far
# below 10 dynamic requests per second; above it were only scanners and a
# load test. The busiest legitimate client, the droplet calling its own API
# through Cloudflare during the 06:00 jobs, peaked at 79 per 10 s (<8/s), so it
# fits without an exemption list (and without any IP in this public repo).
limit_req_zone $binary_remote_addr zone=web_limit:10m rate=10r/s;
