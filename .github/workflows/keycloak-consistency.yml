name: Keycloak consistency

# The realm and the login theme are edited with different tools and reviewed in
# different mental modes, so a contradiction between them survives review. One did
# for ten weeks: the realm required name fields the registration form has never
# rendered, and email-and-password signups produced zero accounts on production
# while Google logins kept working and kept it quiet.

on:
  push:
    paths:
      - 'keycloak/realm-export.json'
      - 'keycloak/themes/**'
      - 'keycloak/README.md'
      - 'keycloak/keycloak-compose.yml'
      - 'scripts/check-registration-form-matches-realm.py'
      - 'scripts/check-keycloak-version.py'
      - '.github/workflows/keycloak-consistency.yml'
  pull_request:
    paths:
      - 'keycloak/realm-export.json'
      - 'keycloak/themes/**'
      - 'keycloak/README.md'
      - 'keycloak/keycloak-compose.yml'
      - 'scripts/check-registration-form-matches-realm.py'
      - 'scripts/check-keycloak-version.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registration-form-matches-realm:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","beast-unit"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Every required attribute is reachable from the registration form
        run: python scripts/check-registration-form-matches-realm.py

      - name: The export and the README name the Keycloak version that runs
        run: python scripts/check-keycloak-version.py
