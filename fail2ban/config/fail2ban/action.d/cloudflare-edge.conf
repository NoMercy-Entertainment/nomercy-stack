# Bans an address at Cloudflare's edge, for every zone on the account.
#
# Web traffic reaches this host only through Cloudflare, so a ban in this host's
# own firewall never sees the client address. This action adds an account-level
# IP access rule instead. The request is blocked before it reaches the origin.
#
# Needs curl. cftoken is an API token limited to "Account Firewall Access Rules
# Write" and cfaccount is the account id. Both come from jail.d/02-cloudflare-edge.local,
# which is gitignored because it holds the token.
#
# actionunban looks the rule up by address and note, so only rules this action
# made are removed.

[Definition]

actionstart =

actionstop =

actioncheck =

actionban = curl -s -o /dev/null -X POST <_cf_prms> \
            -d '{"mode":"block","configuration":{"target":"<cftarget>","value":"<ip>"},"notes":"Fail2Ban <name>"}' \
            <_cf_url>

actionunban = id=$(curl -s -G <_cf_prms> --data-urlencode "mode=block" --data-urlencode "configuration.target=<cftarget>" --data-urlencode "configuration.value=<ip>" --data-urlencode "notes=Fail2Ban <name>" --data-urlencode "per_page=1" <_cf_url> | tr -d ' \n' | grep -o '"id":"[^"]*"' | head -n 1 | cut -d'"' -f4)
              if [ -z "$id" ]; then echo "<name>: no edge rule found for <ip>"; exit 0; fi
              curl -s -o /dev/null -X DELETE <_cf_prms> "<_cf_url>/$id"

_cf_url = https://api.cloudflare.com/client/v4/accounts/<cfaccount>/firewall/access_rules/rules
_cf_prms = -H "Authorization: Bearer <cftoken>" -H "Content-Type: application/json"

[Init]

cftoken =

cfaccount =

cftarget = ip

[Init?family=inet6]

cftarget = ip6
