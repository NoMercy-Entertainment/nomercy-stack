services:
  ### Github runner ##################################
  github-runner:
    container_name: "${APP_NAME}-github-runner"
    restart: unless-stopped
    profiles: [ "dev" ]
    # The runner image is built and published by the nomercy-github-runner repo
    # (its docker-compose.yml uses this same image); this repo holds no runner
    # Dockerfile, so the service pulls the published image instead of building.
    image: ghcr.io/nomercy-entertainment/nomercy-github-runner:latest
    environment:
      GH_TOKEN: ${GITHUB_TOKEN}
      GITHUB_ORG: ${GITHUB_ORG}
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
