
# auth
server {
    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/certificates/cert.pem;
    ssl_certificate_key /etc/certificates/key.pem;

    server_name auth-dev.nomercy.tv auth.nomercy.tv;

    large_client_header_buffers 4 4092k;
    client_max_body_size 100M;

    # Static assets (JS/CSS/images) — no rate limit, these are cacheable
    location /resources/ {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_pass http://keycloak:8080;
    }

    # Everything else — rate-limited (auth endpoints, API, admin actions)
    location / {
        limit_req zone=auth_limit burst=40 nodelay;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_cookie_path ~^/(.+)$ "/$1; SameSite=none; Secure; ";

        # strip X-Frame-Options so CSP frame-ancestors (set in Keycloak admin) takes over
        proxy_hide_header X-Frame-Options;

        # CORS is Keycloak's: each client's Web Origins decide (nomercy-ui "+",
        # nomercy-cast-receiver https://cast.nomercy.tv). The proxy used to echo any
        # Origin, which let every site call the token endpoints from a browser.
        proxy_pass http://keycloak:8080;
    }

}
