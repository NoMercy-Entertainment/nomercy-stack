
# portainer — Docker management UI
# SECURITY: only admin IPs get in. admin-allow.inc holds one `allow <ip>;` per
# admin, written by scripts/write-admin-allow.sh from ADMIN_IPS (gitignored:
# this repo is public). Without that file, everyone gets 403.
server {
    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/certificates/cert.pem;
    ssl_certificate_key /etc/certificates/key.pem;

    server_name portainer.nomercy.tv portainer-dev.nomercy.tv;

    large_client_header_buffers 4 16k;
    client_max_body_size 10M;

    location / {
        include /etc/nginx/conf.d/admin-allow*.inc;
        deny all;

        limit_req zone=admin_limit burst=10 nodelay;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_ssl_verify off;
        # Resolved per request through Docker's DNS, so nginx still starts
        # (and serves every other site) while this container is down.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $admin_upstream https://portainer:9443;
        proxy_pass $admin_upstream;
    }

}
