# Catch-all for any request whose host name matches none of our sites, such as
# a visitor or scanner on the droplet's bare IP. Without it nginx hands the
# request to the first server block it loaded (dev_nomercy.tv.conf), which
# proxies to the production website, and the TLS handshake shows the
# *.nomercy.tv origin certificate to anyone who asks for it. That certificate
# is how scanners tie the origin IP to nomercy.tv.
#
# The file name sorts first so this block loads first. Refuse the TLS
# handshake outright (no certificate is sent) and close plain HTTP without a
# response. Cloudflare always sends SNI, so real traffic never lands here.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    server_name _;

    ssl_reject_handshake on;

    return 444;
}
