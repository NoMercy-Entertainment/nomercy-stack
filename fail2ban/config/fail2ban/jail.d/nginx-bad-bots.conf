[nginx-bad-bots]
enabled = true
port = http,https
filter = nginx-bad-bots
logpath = /remotelogs/nginx/access.log
# 7 days: a wrong match must end (stack#4); a curl 404 is not always a bot.
# 24 h window. No inline comments: fail2ban keeps them in the value.
maxretry = 1
bantime = 604800
findtime = 86400
backend = auto
