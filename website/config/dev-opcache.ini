; Dev only (Dockerfile.dev). The dev container bind-mounts the main nomercy-tv checkout, so a merge
; there must reach PHP-FPM at once. php.ini turns timestamp checks off for production, which kept the
; old code running after a merge (2026-10-11: the locale fix was merged but still failed until an FPM reload).
opcache.validate_timestamps=1
opcache.revalidate_freq=0
