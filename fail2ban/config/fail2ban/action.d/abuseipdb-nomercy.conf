# Reports a ban to AbuseIPDB without the raw log lines (AbuseIPDB comments are public).
# Skips Cloudflare Pseudo IPv4 (240.0.0.0/4, stand-ins for IPv6 visitors) and Cloudflare
# WARP egress (104.16.0.0/12): neither is the attacker's own address.
# The key comes from jail.d/03-abuseipdb.local (gitignored).

[Definition]
norestored = 1
actionstart =
actionstop =
actioncheck =
actionban = case "<ip>" in 24[0-9].*|25[0-5].*|104.1[6-9].*|104.2[0-9].*|104.3[01].*) exit 0 ;; esac
            curl -sSf -o /dev/null "https://api.abuseipdb.com/api/v2/report" -H "Accept: application/json" -H "Key: <abuseipdb_apikey>" --data-urlencode "comment=Fail2Ban <name>: automated web vulnerability scan" --data-urlencode "ip=<ip>" --data "categories=<abuseipdb_category>"
actionunban =

[Init]
abuseipdb_apikey =
abuseipdb_category = 21
