services:

  ### PHPMyAdmin ####################################
  phpmyadmin:
    # Turned off (2026-10-21): not in use. Start it with `docker compose --profile phpmyadmin up -d phpmyadmin`.
    profiles: ["phpmyadmin"]
    container_name: "${APP_NAME}-phpmyadmin"
    hostname: phpmyadmin
    networks:
      backend:
        aliases:
          - phpmyadmin
    restart: unless-stopped
    image: phpmyadmin/phpmyadmin:5.2.3
    depends_on:
      - mysql
    links:
      - mysql:db
    # Only what the sign-on code reads, never the whole stack .env (stack#23).
    environment:
      - MYSQL_USERNAME=${MYSQL_USERNAME}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_SERVER_NAME=${MYSQL_SERVER_NAME}
      - MYSQL_CSP_ALLOW=${MYSQL_CSP_ALLOW:-}
      - KEYCLOAK_FRONTEND_URL=${KEYCLOAK_FRONTEND_URL}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
      - PMA_HOST=mysql
      - ServerName=${MYSQL_SERVER_NAME}
#    ports:
#      - "8080:80"
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - ./config.user.inc.php:/etc/phpmyadmin/config.user.inc.php:ro
      - ./classes/DotEnv.php:/var/www/html/classes/DotEnv.php:ro
      - ./classes/KeycloakClient.php:/var/www/html/classes/KeycloakClient.php:ro
      - ./auth.php:/var/www/html/auth.php:ro
      - ./login.php:/var/www/html/login.php:ro
      - ./logout.php:/var/www/html/logout.php:ro
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
