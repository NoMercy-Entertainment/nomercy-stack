name: Compose validate

# Every compose file is rendered the way it is really used (the stack through
# docker-compose.yml and its include list, dns/ alone) and every build context
# it names must exist. No path filter: a compose change anywhere, or a removed
# folder, must run this. No secrets: .env comes from .env.example.
# Same check locally: bash scripts/validate-compose.sh

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  validate-compose:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","beast-unit"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7

      - name: Every compose file renders and every build context exists
        run: bash scripts/validate-compose.sh

      - name: Only Cloudflare sets the client IP and no database runs without seccomp
        run: python3 scripts/check-stack-trust.py

      - name: The proxy leaves API cache headers to Laravel
        run: bash scripts/check-proxy-cache-headers.sh

      - name: Every host-side artisan call runs as www
        run: bash scripts/check-artisan-runs-as-www.sh

      - name: Trusted runner addresses reach only fail2ban's ignoreip
        run: bash scripts/check-fail2ban-ignore.sh

      - name: The web scan jails ban scanners, never a normal visitor
        run: python3 scripts/check-fail2ban-web-filters.py

      - name: No secret is passed on a command line
        run: python3 scripts/check-no-secret-on-argv.py

      - name: Fail2ban ban and unban report failures
        run: bash scripts/check-fail2ban-actions.sh

      - name: The website deploy resets to the tested commit
        run: bash scripts/test-deploy-release-sha.sh

      - name: The realm export keeps the retired passkey-only roles out
        run: python3 scripts/check-realm-export-roles.py

      - name: phpMyAdmin sign-on is bound to the browser and gets only its own variables
        run: bash scripts/check-phpmyadmin-signon.sh
