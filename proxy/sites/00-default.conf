# Catch-all for any request whose host name matches none of our sites, such as
# a visitor or scanner on the droplet's bare IP. Without it nginx hands the
# request to the first server block it loaded (dev_nomercy.tv.conf), which
# proxies to the production website.
#
# The file name sorts first so this block loads first. It completes the TLS
# handshake and then closes the connection without a response. It must not
# refuse the handshake (ssl_reject_handshake): the Cloudflare tunnel's
# cloudflared connects without our host names in SNI and relies on nginx
# routing by the Host header after the handshake, so refusing it took every
# tunnelled hostname down. The origin certificate is no longer seen by
# scanners on the bare IP, because 80/443 accept only Cloudflare
# (scripts/provision-security.sh).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_certificate /etc/certificates/cert.pem;
    ssl_certificate_key /etc/certificates/key.pem;

    server_name _;

    return 444;
}
