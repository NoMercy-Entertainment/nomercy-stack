
volumes:
  mysql: ~

services:
  ### MySQL #########################################
  mysql:
    container_name: "${APP_NAME}-mysql"
    hostname: mysql
    networks:
      backend:
        aliases:
          - mysql
    restart: unless-stopped
    image: mysql:8.4.11
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USERNAME}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - TZ=${TZ}
#    ports:
#        - "3306:3306"
    healthcheck:
      # The password reaches mysqladmin as MYSQL_PWD, never on its command line (stack#8).
      # $$ keeps compose from writing the value into the container config.
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysqladmin ping -h localhost -u \"$$MYSQL_USER\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - ./data-8.4:/var/lib/mysql
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
